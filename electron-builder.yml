# Reverse-DNS identity for the macOS bundle ID and the Windows installer GUID.
# Do not change it after a release ships: macOS and Windows treat a new ID as a
# different app.
appId: com.makefieldworks.manifest
productName: Manifest
# One naming scheme for every release asset, with no spaces, so release pages
# and SHA256SUMS list e.g. Manifest-0.1.0-alpha.1-mac-arm64.dmg.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# better-sqlite3 ships prebuilt Node-API binaries that load in any Electron
# version, so there is nothing to recompile while packaging.
npmRebuild: false
# Writes dist/installer-license.txt for the Windows installer's license page.
beforePack: ./scripts/installer-license.cjs
# Ad-hoc signs unsigned macOS builds; a no-op unless MANIFEST_ADHOC_SIGN=1.
afterPack: ./scripts/adhoc-sign-mac.cjs
# Notarizes and staples with retries; see the script for why it replaces
# electron-builder's built-in notarize.
afterSign: ./scripts/notarize-mac.cjs

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json
  - resources/icon.png
  # Offline Help (Help → Manifest Help), generated from the website docs; see
  # docs/OFFLINE_HELP.md. Served from app.asar by src/main/help-window.ts.
  - resources/help/**/*
  # better-sqlite3 ships its C++ sources and a prebuilt binary for every
  # platform. Only the binaries are needed at runtime, and each platform section
  # below drops the foreign ones so macOS signing never meets an ELF or PE file.
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/binding.gyp"

fileAssociations:
  - ext: manifestproject
    # Linux packages emit a shared-mime-info XML definition only when this is
    # explicit. It also becomes the desktop entry's MimeType field.
    mimeType: application/x-manifestproject
    name: Manifest Project
    description: Manifest project document
    role: Editor

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  minimumSystemVersion: 13.0
  # Signing uses CSC_LINK/CSC_KEY_PASSWORD (a Developer ID Application .p12)
  # when present, and notarization uses APPLE_API_KEY/APPLE_API_KEY_ID/
  # APPLE_API_ISSUER. Without them the build is unsigned; see docs/RELEASING.md.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
  files:
    - "!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*"
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  icon: resources/icon.ico
  files:
    - "!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*"
  target:
    - target: nsis
      arch:
        - x64

# An assisted (wizard) installer rather than electron-builder's default
# one-click installer, so people can choose who it is installed for, where it
# goes, and whether it adds a desktop shortcut. Upgrades reuse the previous
# install mode and folder, which the installer reads from the registry.
nsis:
  oneClick: false
  # Shows the "Anyone who uses this computer / Only for me" page. "Only for me"
  # (the default, under %LOCALAPPDATA%\Programs) needs no administrator rights;
  # "Anyone" asks for elevation and installs under Program Files.
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Shown after the welcome page; resources/installer.nsh turns it into an
  # informational page (Next, not "I Agree") because the license is MIT. The
  # file is LICENSE with its paragraphs unwrapped, written by the beforePack
  # hook above so the text wraps to the license box instead of mid-sentence.
  license: dist/installer-license.txt
  createStartMenuShortcut: true
  # The desktop shortcut is created by default and removed again when the
  # "Create a desktop shortcut" box on the custom page in
  # resources/installer.nsh is cleared.
  createDesktopShortcut: true
  shortcutName: Manifest
  # Project folders live wherever people keep them and are never touched by the
  # uninstaller; this only keeps app preferences under %APPDATA% as well.
  deleteAppDataOnUninstall: false

linux:
  icon: resources/icon.png
  category: Office
  synopsis: Local-first desktop app for structured project management
  # FPM requires a maintainer for deb/rpm metadata. Keep the release contact
  # explicit so package builds do not depend on package.json author parsing.
  maintainer: MakefieldWorks <robertg@digwave.com>
  files:
    - "!node_modules/better-sqlite3/prebuilds/{darwin,win32}-*"
  target:
    - target: AppImage
      arch:
        - x64
    # Native packages register the launcher, icon, and Manifest project MIME
    # association with the desktop environment. The AppImage remains the
    # portable option for distributions outside the supported package families.
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
