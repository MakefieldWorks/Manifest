name: CI

# Default checks for every push to main and every pull request. Ubuntu runners
# bill at 1x, so this runs unconditionally. macOS/Windows coverage stays opt-in
# through the `ci:full` label in pilot-platform.yml (see CLAUDE.md CI policy).

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Typecheck, unit, and E2E (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun ci
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

      # Ubuntu 23.10+ blocks unprivileged user namespaces through AppArmor,
      # which Chromium's sandbox needs. Re-allow them on this disposable runner
      # instead of launching Electron with --no-sandbox.
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Hidden windows are render-throttled on Linux, which stalls Playwright's
      # actionability checks until tests time out. playwright.config.ts already
      # defaults Linux to visible windows; keep the explicit flag so this job
      # stays visible under xvfb's private display regardless of that default.
      - name: Electron E2E tests
        env:
          MANIFEST_E2E_VISIBLE: "1"
        run: xvfb-run --auto-servernum bun run test:e2e

      # Packaged-app coverage on every PR: build the unpacked Linux package,
      # then run the pilot durability pass (edit, relaunch, snapshot, revert)
      # through its executable rather than the development build.
      - name: Verify Linux package
        run: bun run package:verify
      - name: Generate dogfood fixture
        run: bun run generate:project -- --output ./tmp/pilot-dogfood --name "Pilot Lab Inventory" --nodes 750 --depth 6 --branching 4 --snapshots 4 --seed 20260424
      - name: Packaged dogfood
        env:
          MANIFEST_E2E_VISIBLE: "1"
        run: xvfb-run --auto-servernum bun run test:dogfood -- --project ./tmp/pilot-dogfood --packaged

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-linux
          path: .playwright-artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
