name: Windows archive debug

# TEMPORARY (PR #102): manual-only diagnostics for the Windows archive export
# hang on Electron 44. Remove before merging.

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MANIFEST_ARCHIVE_TRACE_FILE: ${{ github.workspace }}\archive-trace.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies
        run: bun ci
      - name: Versions
        run: |
          git --version
          node --version
          node_modules\.bin\electron.cmd --version
          $env:ELECTRON_RUN_AS_NODE = '1'; node_modules\electron\dist\electron.exe -p "process.versions.node"
      - name: Archive unit tests under Node 22
        timeout-minutes: 5
        continue-on-error: true
        run: node ./node_modules/vitest/vitest.mjs run tests/unit/main/project-archive.test.ts
      - name: Archive unit tests under Electron's Node
        timeout-minutes: 5
        continue-on-error: true
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: node_modules\electron\dist\electron.exe ./node_modules/vitest/vitest.mjs run tests/unit/main/project-archive.test.ts
      - name: Reset trace
        run: Remove-Item -ErrorAction SilentlyContinue $env:MANIFEST_ARCHIVE_TRACE_FILE
      - name: Archive E2E test in Electron
        timeout-minutes: 10
        continue-on-error: true
        run: bun run build; npx playwright test tests/e2e/snapshots.e2e.ts -g "portable archive"
      - name: Git processes left running
        if: always()
        run: Get-CimInstance Win32_Process -Filter "Name like 'git%'" | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List
      - name: Archive trace
        if: always()
        run: Get-Content -ErrorAction SilentlyContinue $env:MANIFEST_ARCHIVE_TRACE_FILE
