name: Release

# Builds release assets on each platform and, for a version tag, attaches them
# to a draft GitHub release that a maintainer reviews and publishes by hand.
# Only v* tags and manual dispatch start it, so the macOS and Windows runners
# never run on an ordinary push or PR (see CLAUDE.md CI policy). A manual
# dispatch is a dry run: it builds and verifies, uploads workflow artifacts, and
# creates no release. Signing secrets and the release steps are documented in
# docs/RELEASING.md.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            runner: macos-15
          - os: win
            runner: windows-2022
          - os: linux
            runner: ubuntu-24.04
    env:
      # Secrets cannot appear in `if:` expressions, so expose whether they are
      # set as plain booleans.
      HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      # A tagged mac build must come out signed and notarized. Windows and
      # Linux ship unsigned for the alpha (docs/RELEASING.md).
      REQUIRE_SIGNED: ${{ github.ref_type == 'tag' && matrix.os == 'mac' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install locked dependencies
        run: bun ci
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

      - name: Write notarization key
        if: matrix.os == 'mac' && env.HAS_NOTARY_KEY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Package
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=("--${{ matrix.os }}" --publish never)
          if [ "${{ matrix.os }}" = mac ]; then
            if [ "$HAS_MAC_CERT" = true ]; then
              export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            else
              # Without a certificate, build unsigned rather than letting
              # electron-builder pick up whatever identity the runner has.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              args+=(-c.mac.identity=null)
            fi
            if [ "$HAS_NOTARY_KEY" = true ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            else
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          node node_modules/electron-builder/cli.js "${args[@]}"

      - name: Verify release assets
        shell: bash
        run: |
          if [ "$REQUIRE_SIGNED" = true ]; then
            node scripts/verify_release.mjs --require-signed
          else
            node scripts/verify_release.mjs
          fi

      - name: Remove notarization key
        if: always() && matrix.os == 'mac'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/Manifest-*.dmg
            dist/Manifest-*.exe
            dist/Manifest-*.AppImage
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Draft GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Combine checksums
        run: |
          cat release/SHA256SUMS-*.txt > release/SHA256SUMS.txt
          rm release/SHA256SUMS-*.txt
          cat release/SHA256SUMS.txt

      # Drafts are invisible to users until a maintainer publishes them, which
      # keeps the one irreversible step in human hands.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Manifest $GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
